apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-ns-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-ns-app
  template:
    metadata:
      labels:
        app: email-ns-app
    spec:
      containers:
      - name: email-ns-app
        image: ruqayakhalil/email-ns-ms-app:latest
        ports:
        - containerPort: 7070
