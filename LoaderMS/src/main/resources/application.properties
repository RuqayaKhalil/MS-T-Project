spring.application.name=LoaderMS

gitHubRaw.service.url=https://raw.githubusercontent.com
gitHubApi.service.url=https://api.github.com/repos
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/platformInformation?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



server.error.whitelabel.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true 

