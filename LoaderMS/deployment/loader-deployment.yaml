apiVersion: apps/v1
kind: Deployment
metadata:
  name: loader-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loader-app
  template:
    metadata:
      labels:
        app: loader-app
    spec:
      containers:
      - name: loader-app
        image: ruqayakhalil/loader-ms-app:latest
        ports:
        - containerPort: 8085
